# Unit tests of the rule libraries in johnlepikhin/system/services/monitoring.scm
# for `promtool test rules'; rules.yml is generated by generate.guile.

rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  # The CPU temperature joins the sensor label of the k10temp sensor.
  - interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="h",chip="k10",sensor="temp1"}'
        values: '96x10'
      - series: 'node_hwmon_sensor_label{instance="h",chip="k10",sensor="temp1",label="Tctl"}'
        values: '1x10'
      - series: 'node_hwmon_temp_celsius{instance="h",chip="k10",sensor="temp3"}'
        values: '99x10'
      - series: 'node_hwmon_sensor_label{instance="h",chip="k10",sensor="temp3",label="Tccd1"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: CpuHot
        exp_alerts: []
      - eval_time: 6m
        alertname: CpuHot
        exp_alerts:
          - exp_labels: {severity: warning, category: hardware, instance: h}
            exp_annotations: {summary: "CPU at 96 °C"}

  # Low disk space, warning and then critical.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="h",mountpoint="/"}'
        values: '200e9 140e9x60 40e9x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: DiskLow
        exp_alerts:
          - exp_labels: {severity: warning, category: resources, instance: h, mountpoint: /}
            exp_annotations: {summary: "/: 130.4GiB free"}
      - eval_time: 50m
        alertname: DiskCritical
        exp_alerts: []
      - eval_time: 100m
        alertname: DiskCritical
        exp_alerts:
          - exp_labels: {severity: critical, category: resources, instance: h, mountpoint: /}
            exp_annotations: {summary: "/: only 37.25GiB free"}

  # The guix gc sawtooth between 360 and 300 GB free is no trend...
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="h",mountpoint="/"}'
        values: '360e9-1e9x59 360e9-1e9x59 360e9-1e9x59 360e9-1e9x59 360e9-1e9x59 360e9-1e9x59 360e9-1e9x59 360e9-1e9x59 360e9-1e9x59'
    alert_rule_test:
      - eval_time: 8h
        alertname: DiskFillingFast
        exp_alerts: []

  # ...but a steady fall of 18 GB an hour is.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="h",mountpoint="/"}'
        values: '390e9-0.3e9x600'
    alert_rule_test:
      - eval_time: 8h
        alertname: DiskFillingFast
        exp_alerts:
          - exp_labels: {severity: warning, category: resources, instance: h, mountpoint: /}
            exp_annotations: {summary: "/ fills up within a day"}

  # A stopped service is reported only while the collector works.
  - interval: 1m
    input_series:
      - series: 'shepherd_service_running{instance="h",service="ntpd"}'
        values: '1 0x10'
      - series: 'shepherd_service_running{instance="h",service="mcron"}'
        values: '1 0x10'
      - series: 'textfile_collector_success{instance="h",collector="shepherd"}'
        values: '1x10'
      - series: 'textfile_collector_last_run_timestamp_seconds{instance="h",collector="shepherd"}'
        values: '0+60x10'
    alert_rule_test:
      - eval_time: 7m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels: {severity: critical, category: services, instance: h, service: ntpd}
            exp_annotations: {summary: "Service ntpd is not running"}
          - exp_labels: {severity: critical, category: services, instance: h, service: mcron}
            exp_annotations: {summary: "Service mcron is not running"}
      - eval_time: 7m
        alertname: ShepherdCollectorFailing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'shepherd_service_running{instance="h",service="ntpd"}'
        values: '0x10'
      - series: 'textfile_collector_success{instance="h",collector="shepherd"}'
        values: '0x10'
      - series: 'textfile_collector_last_run_timestamp_seconds{instance="h",collector="shepherd"}'
        values: '0+60x10'
    alert_rule_test:
      - eval_time: 7m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 7m
        alertname: ShepherdCollectorFailing
        exp_alerts:
          - exp_labels: {severity: critical, category: monitoring, instance: h, collector: shepherd}
            exp_annotations: {summary: "Service states are not collected: check mcron"}

  # A collector that stopped running at all: its file is stale.
  - interval: 1m
    input_series:
      - series: 'textfile_collector_success{instance="h",collector="shepherd"}'
        values: '1x20'
      - series: 'textfile_collector_last_run_timestamp_seconds{instance="h",collector="shepherd"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 7m
        alertname: ShepherdCollectorFailing
        exp_alerts: []
      - eval_time: 9m
        alertname: ShepherdCollectorFailing
        exp_alerts:
          - exp_labels: {severity: critical, category: monitoring, instance: h, collector: shepherd}
            exp_annotations: {summary: "Service states are not collected: check mcron"}

  # New media errors.
  - interval: 5m
    input_series:
      - series: 'smart_media_errors_total{instance="h",device="nvme0"}'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 10m
        alertname: NvmeMediaErrors
        exp_alerts: []
      - eval_time: 20m
        alertname: NvmeMediaErrors
        exp_alerts:
          - exp_labels: {severity: critical, category: hardware, instance: h, device: nvme0}
            exp_annotations: {summary: "nvme0 has new media errors: check smartctl -a and the backups"}

  # The link of lan0 must not drop below 1 Gbit/s.
  - interval: 1m
    input_series:
      - series: 'node_network_carrier{instance="h",device="lan0"}'
        values: '1x10'
      - series: 'node_network_speed_bytes{instance="h",device="lan0"}'
        values: '12500000x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: LinkDegraded
        exp_alerts:
          - exp_labels: {severity: warning, category: hardware, instance: h, device: lan0}
            exp_annotations: {summary: "lan0 is down or slower than 1000 Mbit/s"}

  # A dead uplink: its interface is down while its probes still succeed,
  # routed through the other uplink.
  - interval: 1m
    input_series:
      - series: 'mktxp_interface_running{name="pppoe-out1",routerboard_name="r"}'
        values: '1 0x10'
      - series: 'probe_success{instance="9.9.9.9",uplink="jet"}'
        values: '1x10'
      - series: 'mktxp_interface_running{name="ether2",routerboard_name="r"}'
        values: '1x10'
      - series: 'probe_success{instance="1.0.0.1",uplink="starlink"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: UplinkDown
        exp_alerts:
          - exp_labels: {severity: warning, category: network, uplink: jet}
            exp_annotations: {summary: "Uplink jet (pppoe-out1) is down"}
      - eval_time: 5m
        alertname: UplinksAllDown
        exp_alerts: []

  # A port negotiated below its expected rate.
  - interval: 1m
    input_series:
      - series: 'mktxp_interface_rate{name="ether2",routerboard_name="r"}'
        values: '100x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: RouterPortSlow
        exp_alerts:
          - exp_labels: {severity: warning, category: network, name: ether2, routerboard_name: r}
            exp_annotations: {summary: "ether2 runs at 100 Mbit/s instead of 1000"}

  # A machine that was at home but made no backup for two days...
  - interval: 5m
    input_series:
      - series: 'restic_repository_snapshot_mtime_seconds{instance="h",repository="laptop/home"}'
        values: '0x700'
      - series: 'restic_repository_snapshot_mtime_seconds{instance="h",repository="server/data"}'
        values: '0+300x700'
      - series: 'probe_success{instance="192.168.88.92",job="probe-laptop",presence="laptop"}'
        values: '1x700'
    alert_rule_test:
      - eval_time: 47h
        alertname: BackupStale
        exp_alerts: []
      - eval_time: 50h
        alertname: BackupStale
        exp_alerts:
          - exp_labels: {severity: warning, category: backups, repository: laptop/home}
            exp_annotations: {summary: "No new backup in laptop/home for 2d 2h 0m 0s"}

  # ...is fine while away, up to the ceiling of 30 days.
  - interval: 5m
    input_series:
      - series: 'restic_repository_snapshot_mtime_seconds{instance="h",repository="laptop/home"}'
        values: '0x9000'
      - series: 'restic_repository_snapshot_mtime_seconds{instance="h",repository="server/data"}'
        values: '0+300x9000'
      - series: 'probe_success{instance="192.168.88.92",job="probe-laptop",presence="laptop"}'
        values: '0x9000'
    alert_rule_test:
      - eval_time: 20d
        alertname: BackupStale
        exp_alerts: []
      - eval_time: 30d1h
        alertname: BackupStale
        exp_alerts:
          - exp_labels: {severity: warning, category: backups, repository: laptop/home}
            exp_annotations: {summary: "No new backup in laptop/home for 30d 1h 0m 0s"}
      - eval_time: 1h
        alertname: ProbeFailed
        exp_alerts: []

  # A machine without a presence probe: two days, and a missing repository.
  - interval: 5m
    input_series:
      - series: 'restic_repository_snapshot_mtime_seconds{instance="h",repository="server/data"}'
        values: '0x700'
      - series: 'restic_repository_snapshot_mtime_seconds{instance="h",repository="laptop/home"}'
        values: '0+300x700'
    alert_rule_test:
      - eval_time: 50h
        alertname: BackupStale
        exp_alerts:
          - exp_labels: {severity: warning, category: backups, repository: server/data}
            exp_annotations: {summary: "No new backup in server/data for 2d 2h 0m 0s"}

  - interval: 1h
    input_series: []
    alert_rule_test:
      - eval_time: 1h
        alertname: BackupStale
        exp_alerts:
          - exp_labels: {severity: warning, category: backups, repository: laptop/home}
            exp_annotations: {summary: "No new backup in laptop/home for 1s"}
          - exp_labels: {severity: warning, category: backups, repository: server/data}
            exp_annotations: {summary: "No new backup in server/data for 1s"}

  # Forged or misdated snapshots stop the forgetting.
  - interval: 1m
    input_series:
      - series: 'restic_repository_future_snapshots{instance="h",repository="laptop/home"}'
        values: '1x5'
      - series: 'restic_maintenance_success{instance="h",repository="laptop/home",step="sanity"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: BackupFutureSnapshots
        exp_alerts:
          - exp_labels: {severity: critical, category: backups, instance: h, repository: laptop/home}
            exp_annotations: {summary: "laptop/home has 1 snapshots dated in the future: forgetting is stopped; check the client's clock or a compromised client"}
      - eval_time: 2m
        alertname: BackupMaintenanceFailing
        exp_alerts:
          - exp_labels: {severity: warning, category: backups, instance: h, repository: laptop/home, step: sanity}
            exp_annotations: {summary: "Backup maintenance of laptop/home fails at sanity: see /var/log/mcron.log"}

  - interval: 1m
    input_series:
      - series: 'restic_repository_size_bytes{instance="h",repository="laptop/home"}'
        values: '6e11x5'
      - series: 'restic_repository_size_bytes{instance="h",repository="windows/users"}'
        values: '5e11x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: BackupStorageLarge
        exp_alerts:
          - exp_labels: {severity: warning, category: backups}
            exp_annotations: {summary: "Backups take 1TiB"}

  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{instance="https://h:8000/",job="probe-backup"}'
        values: '3000000x100'
    alert_rule_test:
      - eval_time: 90m
        alertname: CertificateExpiring
        exp_alerts:
          - exp_labels: {severity: warning, category: services, instance: "https://h:8000/", job: probe-backup}
            exp_annotations: {summary: "Certificate of https://h:8000/ expires in 34d 15h 50m 0s"}

  # A daily collector is fine at 20 hours old, stalled beyond its max age.
  - interval: 1m
    input_series:
      - series: 'textfile_collector_success{instance="h",collector="restic-maintenance"}'
        values: '1x3100'
      - series: 'textfile_collector_last_run_timestamp_seconds{instance="h",collector="restic-maintenance"}'
        values: '0x3100'
      - series: 'textfile_collector_max_age_seconds{instance="h",collector="restic-maintenance"}'
        values: '172800x3100'
    alert_rule_test:
      - eval_time: 20h
        alertname: TextfileCollectorFailing
        exp_alerts: []
      - eval_time: 50h
        alertname: TextfileCollectorFailing
        exp_alerts:
          - exp_labels: {severity: warning, category: monitoring, instance: h, collector: restic-maintenance}
            exp_annotations: {summary: "Textfile collector restic-maintenance fails"}

  # The Watchdog always fires.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels: {severity: info}
            exp_annotations: {summary: "The alerting pipeline works"}

  # Devices: a low battery, and a device gone except during a power cut.
  - interval: 1m
    input_series:
      - series: 'hass_sensor_battery_percent{instance="h",entity="sensor.spalnia_okno_battery",friendly_name="Okno"}'
        values: '15x120'
      - series: 'hass_entity_available{instance="h",entity="sensor.spalnia_okno_battery"}'
        values: '0x120'
      - series: 'hass_entity_available{instance="h",entity="sensor.kladovka_server_power"}'
        values: '0x120'
      - series: 'hass_entity_available{instance="h",entity="sensor.server_cost"}'
        values: '0x120'
      - series: 'hass_input_boolean_state{instance="h",entity="input_boolean.outage"}'
        values: '0x90 1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: DeviceBatteryLow
        exp_alerts: []
      - eval_time: 61m
        alertname: DeviceBatteryLow
        exp_alerts:
          - exp_labels: {severity: warning, category: devices, instance: h, entity: sensor.spalnia_okno_battery, friendly_name: Okno}
            exp_annotations: {summary: "Battery of Okno (sensor.spalnia_okno_battery) is at 15%"}
      - eval_time: 61m
        alertname: DeviceUnavailable
        exp_alerts:
          - exp_labels: {severity: warning, category: devices, instance: h, entity: sensor.spalnia_okno_battery}
            exp_annotations: {summary: "sensor.spalnia_okno_battery has been unavailable for a while: the device is off, out of range or out of battery"}
          - exp_labels: {severity: warning, category: devices, instance: h, entity: sensor.kladovka_server_power}
            exp_annotations: {summary: "sensor.kladovka_server_power has been unavailable for a while: the device is off, out of range or out of battery"}
      - eval_time: 119m
        alertname: DeviceUnavailable
        exp_alerts: []

  # Updates: a newer image, an old system and a failing check.
  - interval: 1m
    input_series:
      - series: 'container_image_update_available{instance="h",image="ghcr.io/koenkk/zigbee2mqtt",current="2.14.2",latest="2.15.0"}'
        values: '1x3100'
      - series: 'container_image_update_available{instance="h",image="docker.io/grafana/loki",current="3.7.9",latest="3.7.9"}'
        values: '0x3100'
      - series: 'container_image_check_success{instance="h",image="docker.io/grafana/alloy"}'
        values: '0x3100'
      - series: 'guix_system_generation_timestamp_seconds{instance="h"}'
        values: '0x3100'
    alert_rule_test:
      - eval_time: 2h
        alertname: ContainerImageUpdateAvailable
        exp_alerts:
          - exp_labels: {severity: info, notify: weekly, instance: h, image: ghcr.io/koenkk/zigbee2mqtt, current: 2.14.2, latest: 2.15.0}
            exp_annotations: {summary: "ghcr.io/koenkk/zigbee2mqtt: 2.15.0 is out, 2.14.2 runs"}
      - eval_time: 2h
        alertname: SystemOutdated
        exp_alerts: []
      - eval_time: 2h
        alertname: UpdateCheckFailing
        exp_alerts: []
      - eval_time: 50h
        alertname: UpdateCheckFailing
        exp_alerts:
          - exp_labels: {severity: info, notify: weekly, instance: h, image: docker.io/grafana/alloy}
            exp_annotations: {summary: "Tags of docker.io/grafana/alloy cannot be listed"}

  # Prebuild: a failing step, an old run, a cold cache, a large cache.
  - interval: 1m
    input_series:
      - series: 'guix_prebuild_step_success{instance="h",step="warm"}'
        values: '0x3000'
      - series: 'guix_prebuild_target_success{instance="h",target="laptop-home"}'
        values: '1x3000'
      - series: 'guix_prebuild_last_success_timestamp_seconds{instance="h"}'
        values: '0x3000'
      - series: 'guix_prebuild_warm_missing{instance="h"}'
        values: '3x3000'
      - series: 'guix_publish_cache_bytes{instance="h"}'
        values: '2e11x3000'
    alert_rule_test:
      - eval_time: 1m
        alertname: PrebuildFailing
        exp_alerts:
          - exp_labels: {severity: warning, category: builds, instance: h, step: warm}
            exp_annotations: {summary: "Prebuild fails at warm: see /var/log/guix-prebuild"}
      - eval_time: 2h
        alertname: PrebuildStale
        exp_alerts: []
      - eval_time: 50h
        alertname: PrebuildStale
        exp_alerts:
          - exp_labels: {severity: warning, category: builds, instance: h}
            exp_annotations: {summary: "No prebuild was published for 2d 2h 0m 0s: updates fetch from the internet"}
      - eval_time: 2h
        alertname: PrebuildCacheCold
        exp_alerts:
          - exp_labels: {severity: warning, category: builds, instance: h}
            exp_annotations: {summary: "3 items of the prebuild are not in the publish cache yet"}
      - eval_time: 1m
        alertname: PublishCacheLarge
        exp_alerts:
          - exp_labels: {severity: warning, category: builds, instance: h}
            exp_annotations: {summary: "The guix publish cache takes 186.3GiB"}

  # A host where no prebuild was ever published.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 90m
        alertname: PrebuildStale
        exp_alerts:
          - exp_labels: {severity: warning, category: builds}
            exp_annotations: {summary: "No prebuild was published for 1s: updates fetch from the internet"}
