# Unit tests of the rule libraries in johnlepikhin/system/services/monitoring.scm
# for `promtool test rules'; rules.yml is generated by generate.scm.

rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  # The CPU temperature joins the sensor label of the k10temp sensor.
  - interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="h",chip="k10",sensor="temp1"}'
        values: '96x10'
      - series: 'node_hwmon_sensor_label{instance="h",chip="k10",sensor="temp1",label="Tctl"}'
        values: '1x10'
      - series: 'node_hwmon_temp_celsius{instance="h",chip="k10",sensor="temp3"}'
        values: '99x10'
      - series: 'node_hwmon_sensor_label{instance="h",chip="k10",sensor="temp3",label="Tccd1"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: CpuHot
        exp_alerts: []
      - eval_time: 6m
        alertname: CpuHot
        exp_alerts:
          - exp_labels: {severity: warning, category: hardware, instance: h}
            exp_annotations: {summary: "CPU at 96 °C"}

  # Low disk space, warning and then critical.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="h",mountpoint="/"}'
        values: '200e9 140e9x60 40e9x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: DiskLow
        exp_alerts:
          - exp_labels: {severity: warning, category: resources, instance: h, mountpoint: /}
            exp_annotations: {summary: "/: 130.4GiB free"}
      - eval_time: 50m
        alertname: DiskCritical
        exp_alerts: []
      - eval_time: 100m
        alertname: DiskCritical
        exp_alerts:
          - exp_labels: {severity: critical, category: resources, instance: h, mountpoint: /}
            exp_annotations: {summary: "/: only 37.25GiB free"}

  # The guix gc sawtooth between 360 and 300 GB free is no trend...
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="h",mountpoint="/"}'
        values: '360e9-1e9x59 360e9-1e9x59 360e9-1e9x59 360e9-1e9x59 360e9-1e9x59 360e9-1e9x59 360e9-1e9x59 360e9-1e9x59 360e9-1e9x59'
    alert_rule_test:
      - eval_time: 8h
        alertname: DiskFillingFast
        exp_alerts: []

  # ...but a steady fall of 18 GB an hour is.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="h",mountpoint="/"}'
        values: '390e9-0.3e9x600'
    alert_rule_test:
      - eval_time: 8h
        alertname: DiskFillingFast
        exp_alerts:
          - exp_labels: {severity: warning, category: resources, instance: h, mountpoint: /}
            exp_annotations: {summary: "/ fills up within a day"}

  # A stopped service is reported only while the collector works.
  - interval: 1m
    input_series:
      - series: 'shepherd_service_running{instance="h",service="ntpd"}'
        values: '1 0x10'
      - series: 'shepherd_service_running{instance="h",service="mcron"}'
        values: '1 0x10'
      - series: 'textfile_collector_success{instance="h",collector="shepherd"}'
        values: '1x10'
      - series: 'textfile_collector_last_run_timestamp_seconds{instance="h",collector="shepherd"}'
        values: '0+60x10'
    alert_rule_test:
      - eval_time: 7m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels: {severity: critical, category: services, instance: h, service: ntpd}
            exp_annotations: {summary: "Service ntpd is not running"}
          - exp_labels: {severity: critical, category: services, instance: h, service: mcron}
            exp_annotations: {summary: "Service mcron is not running"}
      - eval_time: 7m
        alertname: ShepherdCollectorFailing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'shepherd_service_running{instance="h",service="ntpd"}'
        values: '0x10'
      - series: 'textfile_collector_success{instance="h",collector="shepherd"}'
        values: '0x10'
      - series: 'textfile_collector_last_run_timestamp_seconds{instance="h",collector="shepherd"}'
        values: '0+60x10'
    alert_rule_test:
      - eval_time: 7m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 7m
        alertname: ShepherdCollectorFailing
        exp_alerts:
          - exp_labels: {severity: critical, category: monitoring, instance: h, collector: shepherd}
            exp_annotations: {summary: "Service states are not collected: check mcron"}

  # A collector that stopped running at all: its file is stale.
  - interval: 1m
    input_series:
      - series: 'textfile_collector_success{instance="h",collector="shepherd"}'
        values: '1x20'
      - series: 'textfile_collector_last_run_timestamp_seconds{instance="h",collector="shepherd"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 7m
        alertname: ShepherdCollectorFailing
        exp_alerts: []
      - eval_time: 9m
        alertname: ShepherdCollectorFailing
        exp_alerts:
          - exp_labels: {severity: critical, category: monitoring, instance: h, collector: shepherd}
            exp_annotations: {summary: "Service states are not collected: check mcron"}

  # New media errors.
  - interval: 5m
    input_series:
      - series: 'smart_media_errors_total{instance="h",device="nvme0"}'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 10m
        alertname: NvmeMediaErrors
        exp_alerts: []
      - eval_time: 20m
        alertname: NvmeMediaErrors
        exp_alerts:
          - exp_labels: {severity: critical, category: hardware, instance: h, device: nvme0}
            exp_annotations: {summary: "nvme0 has new media errors: check smartctl -a and the backups"}

  # The link of lan0 must not drop below 1 Gbit/s.
  - interval: 1m
    input_series:
      - series: 'node_network_carrier{instance="h",device="lan0"}'
        values: '1x10'
      - series: 'node_network_speed_bytes{instance="h",device="lan0"}'
        values: '12500000x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: LinkDegraded
        exp_alerts:
          - exp_labels: {severity: warning, category: hardware, instance: h, device: lan0}
            exp_annotations: {summary: "lan0 is down or slower than 1000 Mbit/s"}

  # A dead uplink: its interface is down while its probes still succeed,
  # routed through the other uplink.
  - interval: 1m
    input_series:
      - series: 'mktxp_interface_running{name="pppoe-out1",routerboard_name="r"}'
        values: '1 0x10'
      - series: 'probe_success{instance="9.9.9.9",uplink="jet"}'
        values: '1x10'
      - series: 'mktxp_interface_running{name="ether2",routerboard_name="r"}'
        values: '1x10'
      - series: 'probe_success{instance="1.0.0.1",uplink="starlink"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: UplinkDown
        exp_alerts:
          - exp_labels: {severity: warning, category: network, uplink: jet}
            exp_annotations: {summary: "Uplink jet (pppoe-out1) is down"}
      - eval_time: 5m
        alertname: UplinksAllDown
        exp_alerts: []

  # A port negotiated below its expected rate.
  - interval: 1m
    input_series:
      - series: 'mktxp_interface_rate{name="ether2",routerboard_name="r"}'
        values: '100x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: RouterPortSlow
        exp_alerts:
          - exp_labels: {severity: warning, category: network, name: ether2, routerboard_name: r}
            exp_annotations: {summary: "ether2 runs at 100 Mbit/s instead of 1000"}

  # The Watchdog always fires.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels: {severity: info}
            exp_annotations: {summary: "The alerting pipeline works"}
